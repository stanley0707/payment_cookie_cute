name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start test DB
        run: docker compose -f docker-compose.test.yml up -d test_db

      - name: Run migrations
        run: docker compose -f docker-compose.test.yml run --rm --build test_migrations

      - name: Run tests
        run: docker compose -f docker-compose.test.yml run --rm --build tests

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans