[project]
name = "payment-cookie-cute"
version = "0.1.0"
description = ""
authors = [
    {name = "Stas Shilov",email = "shilowstanislaw@gmail.com"}
]
license = "MIT"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "sqlalchemy[asyncio] (>=2.1.6,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "faststream[rabbit] (>=0.7.8,<0.8.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "tenacity (>=9.2.1,<10.0.0)",
    "sqlalchemy-utils (>=0.43.0,<0.44.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "pytest-anyio (>=0.0.0,<0.0.1)",
    "anyio (>=4.15.1,<5.0.0)",
]


[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "Q"] # Ошибки, импорты, кавычки
ignore = ["E501"] # Длину строк проверяем форматтером, а не линтером

[tool.ruff.format]
quote-style = "double"
