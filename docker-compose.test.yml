name: payment_cookie_cute_test

services:
  test_db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - test_net

  test_migrations:
    build:
      context: .
      target: migrations
    environment:
      DATABASE_DRIVER: postgresql+asyncpg
      DATABASE_HOST: test_db
      DATABASE_NAME: postgres_test
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_PORT: 5432
    volumes:
      - ./payment_cookie_cute:/usr/src/app/payment_cookie_cute
      - ./alembic:/usr/src/app/alembic
      - ./alembic.ini:/usr/src/app/alembic.ini
    depends_on:
      test_db:
        condition: service_healthy
    networks:
      - test_net
    restart: "no"

  tests:
    build:
      context: .
      target: tests
    environment:
      PCC_API_KEY: test-api-key
      DATABASE_DRIVER: postgresql+asyncpg
      DATABASE_HOST: test_db
      DATABASE_NAME: postgres_test
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_PORT: 5432
    volumes:
      - ./payment_cookie_cute:/usr/src/app/payment_cookie_cute
      - ./tests:/usr/src/app/tests
      - ./alembic:/usr/src/app/alembic
      - ./alembic.ini:/usr/src/app/alembic.ini
    depends_on:
      test_db:
        condition: service_healthy
      test_migrations:
        condition: service_completed_successfully
    networks:
      - test_net

networks:
  test_net:
    driver: bridge